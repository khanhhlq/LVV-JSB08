<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dog Social</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
        crossorigin="anonymous"></script>
</head>

<body>
    <nav class="navbar sm:navbar-expand bg-1 fg-2">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">DogSocial</a>
            <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer"
                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon" aria-hidden="true"></span>
            </button>
            <dialog class="drawer drawer-end" tabindex="-1" id="navbarNavAltMarkup"
                aria-labelledby="navbarNavAltMarkupLabel">
                <div class="drawer-header">
                    <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
                </div>
                <div class="drawer-body">
                    <div class="nav nav-pills navbar-nav">
                        <a class="nav-link active" aria-current="page" href="#">Contact</a>
                        <a class="nav-link" href="#">Pricing</a>
                        <a class="nav-link" href="#">Download</a>
                    </div>
                </div>
            </dialog>
        </div>
    </nav>


    <div class="container-fluid text-center bg-danger d-flex justify-content-center">
        <div class="row p-10">
            <div class="col text-start h-100 flex-column d-flex justify-content-center">
                <h1>Meet new and interesting dogs in your area.</h1>
                <button type="button" class="btn-solid theme-primary m-2">Download 😍</button>
                <button type="button" class="btn-outline theme-warning m-2">Download 😊</button>
            </div>
            <div class="col">
                <img src="https://mindxdocument.github.io/K12-JSB-SAMPLE/SS7_SS8/images/iphone6.png" alt="" srcset="" width="300px">
            </div>
        </div>
    </div>



</body>

</html>
