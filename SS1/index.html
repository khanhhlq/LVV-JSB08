<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SS1</title>
  </head>
  <body>
    <!-- NOTE -->
    <!-- Thẻ i là thẻ in nghiêng -->
    <!-- Thẻ br là thẻ xuống dòng -->
    <!-- Thẻ b là thẻ in đâm -->
    
    <!-- Thẻ tiêu đề h1-h6 -->
    <h1>Today's lesson is very fun</h1>
    <h2>Today's lesson is very fun</h2>
    <h3>Today's lesson is very fun</h3>
    <h4>Today's lesson is very fun</h4>
    <h5>Today's lesson is very fun</h5>
    <h6>Today's lesson is very fun</h6>

    <!-- Thẻ p là văn bản -->
    <p><i>Today's</i> <b>lesson</b> is <br> very fun</p>

    <!-- Thẻ img là thẻ hình ảnh -->
    <img src="./img/mindx.jpg" alt="No image" width="10%">

    <!-- Thẻ iframe là thẻ nhúng -->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/ktuyP6lfpb8?si=5gvCgKY-5q4OxHkm" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    
    <!-- Thẻ danh sách không có thứ tự -->
    <ul>
        <li>
            Task 1
            <ol>
                <li>Task 1.1</li>
                <li>Task 1.2</li>
            </ol>
        </li>
        <li>Task 2</li>
        <li>Task 3</li>
    </ul>
    <!-- Thẻ danh sách có thứ tự -->
    <ol>
        <li>Work 1</li>
        <li>Work 2</li>
        <li>Work 3</li>
    </ol>

</body>
</html>
