<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Static -->
    <h2 style="color: red;">Đây là thẻ tiêu đề</h2>

    <!-- Relative -->
    <div class="container-relative">
        <h2>Đây là một button</h2>
        <button id="btn">Click me!</button>
    </div>

    <!-- Absolute -->
    <div class="container-absolute">
        <p>Đây là một thẻ văn bản</p>
        <nav class="menu">
            <a href="#">Trang chủ</a>
            <a href="#">Giới thiệu</a>
            <a href="#">Liên hệ</a>
        </nav>
    </div>

    <!-- Fixed -->
    <div class="container-fixed">
        <div class="notification">
            Bạn có 1 thông báo mới
        </div>
    </div>
</body>
</html>
